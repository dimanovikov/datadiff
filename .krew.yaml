# Template for the krew-index manifest, rendered by krew-release-bot on each
# release (see the update-krew job in .github/workflows/release.yml). krew
# checks for a file named LICENSE, so LICENSE-MIT is installed under that name.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: datadiff
spec:
  version: {{ .TagName }}
  homepage: https://github.com/dimanovikov/datadiff
  shortDescription: Show kubectl diff as changed fields, not lines
  description: |
    Runs kubectl diff with datadiff as the diff program. Instead of a line
    diff of YAML it prints each field that changed, such as
    spec.replicas: 3 → 5. Key order and formatting are ignored, and with
    --key name list items such as containers and env vars are matched by
    name, so reordering them is not a change.

    datadiff options (--key, --ignore, --fail-on and the rest) go to
    datadiff, every other argument goes to kubectl diff unchanged:

      kubectl datadiff -f k8s/ --key name
      kubectl datadiff -k overlays/prod --key name --ignore metadata.generation
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/dimanovikov/datadiff/releases/download/{{ .TagName }}/datadiff-{{ .TagName }}-aarch64-apple-darwin.tar.gz" .TagName }}
    bin: datadiff
    files:
    - from: datadiff
      to: .
    - from: LICENSE-MIT
      to: LICENSE
    - from: LICENSE-APACHE
      to: .
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/dimanovikov/datadiff/releases/download/{{ .TagName }}/datadiff-{{ .TagName }}-x86_64-apple-darwin.tar.gz" .TagName }}
    bin: datadiff
    files:
    - from: datadiff
      to: .
    - from: LICENSE-MIT
      to: LICENSE
    - from: LICENSE-APACHE
      to: .
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/dimanovikov/datadiff/releases/download/{{ .TagName }}/datadiff-{{ .TagName }}-x86_64-unknown-linux-gnu.tar.gz" .TagName }}
    bin: datadiff
    files:
    - from: datadiff
      to: .
    - from: LICENSE-MIT
      to: LICENSE
    - from: LICENSE-APACHE
      to: .
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/dimanovikov/datadiff/releases/download/{{ .TagName }}/datadiff-{{ .TagName }}-aarch64-unknown-linux-gnu.tar.gz" .TagName }}
    bin: datadiff
    files:
    - from: datadiff
      to: .
    - from: LICENSE-MIT
      to: LICENSE
    - from: LICENSE-APACHE
      to: .
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha "https://github.com/dimanovikov/datadiff/releases/download/{{ .TagName }}/datadiff-{{ .TagName }}-x86_64-pc-windows-msvc.zip" .TagName }}
    bin: datadiff.exe
    files:
    - from: datadiff.exe
      to: .
    - from: LICENSE-MIT
      to: LICENSE
    - from: LICENSE-APACHE
      to: .
