name: Release

# Push a version tag to build and publish release binaries:
#   git tag v0.3.1 && git push origin v0.3.1
# This builds the binaries, attaches them to the GitHub Release, and then
# publishes the crate to crates.io.
on:
  push:
    tags: ["v*"]
  # Re-sync the Homebrew formula and the Scoop manifest with a release that
  # already exists, without cutting a new one.
  workflow_dispatch:
    inputs:
      resync:
        description: "Existing tag to re-sync packages with, e.g. v0.3.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14 # Apple Silicon
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          tar -czf datadiff-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release datadiff

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/datadiff.exe `
            -DestinationPath datadiff-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: datadiff-${{ github.ref_name }}-${{ matrix.target }}.*

  # Publish to crates.io via OIDC trusted publishing — no API token in secrets.
  # Requires a one-time crates.io-side config: the crate's Settings -> Trusted
  # Publishing -> add owner `dimanovikov`, repo `datadiff`, workflow `release.yml`.
  # Runs only after the binaries built, so a broken build never yields a crates.io
  # version (published versions can be yanked, never deleted).
  publish-crate:
    name: Publish to crates.io
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify the tag matches Cargo.toml
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "publishing datadiff $manifest"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Homebrew and Scoop were updated by hand, which is how the tap drifted a whole
  # version behind. Both now follow the release automatically.
  update-packages:
    name: Update Homebrew tap and Scoop bucket
    needs: build
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the packages token
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PACKAGES_TOKEN is unset. Create a fine-grained PAT with" \
                 "Contents: read and write on homebrew-datadiff and scoop-bucket," \
                 "then add it as a repository secret."
            exit 1
          fi

      - name: Collect the release checksums
        id: sums
        run: |
          tag="${{ github.event.inputs.resync || github.ref_name }}"
          version="${tag#v}"
          base="https://github.com/${{ github.repository }}"
          fetch() { curl -fsSL --retry 5 --retry-all-errors "$1" | sha256sum | cut -d" " -f1; }

          sums="{}"
          for f in \
            "datadiff-v$version-aarch64-apple-darwin.tar.gz" \
            "datadiff-v$version-x86_64-unknown-linux-gnu.tar.gz" \
            "datadiff-v$version-aarch64-unknown-linux-gnu.tar.gz" \
            "datadiff-v$version-x86_64-pc-windows-msvc.zip"; do
            sums=$(jq -c --arg k "$f" --arg v "$(fetch "$base/releases/download/v$version/$f")" \
              '.[$k]=$v' <<<"$sums")
          done
          # Intel Macs build from source, so the tag tarball needs a checksum too.
          sums=$(jq -c --arg k "v$version.tar.gz" --arg v "$(fetch "$base/archive/refs/tags/v$version.tar.gz")" \
            '.[$k]=$v' <<<"$sums")

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checksums=$sums" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-datadiff
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: tap

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scoop-bucket
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: bucket

      - name: Rewrite the formula and the manifest
        env:
          CHECKSUMS: ${{ steps.sums.outputs.checksums }}
          VERSION: ${{ steps.sums.outputs.version }}
        run: |
          python3 .github/scripts/bump_packages.py "$VERSION" tap/Formula/datadiff.rb
          python3 .github/scripts/bump_packages.py "$VERSION" bucket/datadiff.json

      - name: Commit and push
        env:
          VERSION: ${{ steps.sums.outputs.version }}
        run: |
          for dir in tap bucket; do
            git -C "$dir" config user.name "github-actions[bot]"
            git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$dir" add -A
            if git -C "$dir" diff --quiet --cached; then
              echo "$dir is already at $VERSION"
              continue
            fi
            git -C "$dir" commit -m "datadiff $VERSION"
            git -C "$dir" push
          done
