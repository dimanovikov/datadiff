[package]
name = "datadiff"
version = "0.4.1"
edition = "2021"
description = "Semantic diff for JSON, YAML, CSV, TOML and XML that plugs into git diff"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dimanovikov/datadiff"
homepage = "https://github.com/dimanovikov/datadiff"
keywords = ["diff", "git", "json", "yaml", "csv"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
csv = "1"
toml = "0.8"
anyhow = "1"
colored = "3"
dotenvy = "0.15"
quick-xml = { version = "0.38", features = ["serialize"] }

[dev-dependencies]
serde_json = "1"

# Optimized binaries for GitHub Releases.
[profile.release]
lto = true
codegen-units = 1
strip = true
